name: Check and deploy site-v1

on:
  push:
    branches: ["main", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Läuft auf jedem Push und PR: kaputtes HTML, tote Links, fehlende Assets,
  # nicht committete Generator-Ausgabe → roter Haken, kein Deploy.
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Validate site-v1
        run: python3 tools/check.py

  deploy:
    # Nur main geht live; dev und PRs bekommen nur die Prüfung.
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: check
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Upload site-v1 as Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site-v1
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
